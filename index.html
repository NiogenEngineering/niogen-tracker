<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niogen Tracker</title>
  <meta name="theme-color" content="#12344f">
  <meta name="description" content="Inventory and restoration cost tracker for vintage radios.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // Apply the saved theme before first paint so there is no light flash in dark mode.
    try {
      var p = localStorage.getItem('niogen-theme') || 'auto';
      var dark = p === 'dark' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/radios" aria-label="Niogen Tracker, home">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M13 40V19C13 4 35 4 35 19V40" fill="rgba(243,232,200,.10)" stroke="#f3e8c8" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="18.5" y="19" width="11" height="18" fill="none" stroke="#f3e8c8" stroke-width="1.8"/>
        <path d="M22 37V27a2 2 0 0 1 4 0v10" stroke="#e2802f" stroke-width="2.2" fill="none"/>
        <path d="M19 11.5q5-3.5 10 0" stroke="#f3e8c8" stroke-width="1.5" fill="none" opacity=".7"/>
        <rect x="11" y="40" width="26" height="4.5" fill="#f3e8c8"/>
        <path d="M17 44.5v2.5M24 44.5v2.5M31 44.5v2.5" stroke="#f3e8c8" stroke-width="2"/>
      </svg>
      <span class="brand-name">Niogen Tracker</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/radios" data-route="radios">Radios</a>
      <a href="#/inventory" data-route="inventory">Inventory</a>
      <a href="#/reports" data-route="reports">Reports</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="top-tools">
      <button class="btn small" id="installBtn" data-action="install-app" hidden>Install app</button>
      <button class="btn small ghost on-bar" id="themeBtn" data-action="toggle-theme">Dark mode</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"><p class="loading">Loading</p></main>
  <dialog id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="loading">Niogen Tracker needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
  <script>
    // If the app has not started after a moment, say why instead of leaving "Loading" on screen.
    setTimeout(function () {
      if (window.__niogenStarted) return;
      var v = document.getElementById('view');
      var local = location.protocol === 'file:';
      v.innerHTML = '<div class="panel"><h1>The app could not start</h1>' + (local
        ? '<p>This page was opened from a file on your computer. Browsers block apps like this from running that way.</p><p>Open Niogen Tracker from its web address instead, for example <strong>https://YOURNAME.github.io/niogen-tracker/</strong>. Your data is saved under that address.</p>'
        : '<p>The app files did not load. Most often a folder (<strong>js</strong>, <strong>css</strong>, <strong>fonts</strong>, or <strong>icons</strong>) was left out of the upload, or the site is still publishing.</p><p>Check that your repository shows <strong>index.html</strong>, <strong>js</strong>, and <strong>css</strong> at its top level, wait a minute, then reload with Ctrl+Shift+R.</p>')
        + '</div>';
    }, 2500);
  </script>
</body>
</html>
